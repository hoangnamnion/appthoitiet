<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thời Tiết" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1b35" />
  <title>Thời Tiết – Hoằng Tiến</title>
  <meta name="description" content="Ứng dụng thời tiết Hoằng Tiến, Thanh Hóa" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated Sky Background -->
  <div class="sky-bg" id="sky-bg">
    <div class="sky-layer layer-1"></div>
    <div class="sky-layer layer-2"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <canvas id="particles-canvas"></canvas>
  </div>

  <!-- App Shell -->
  <div class="app-shell">

    <!-- Status Bar (iOS style) -->
    <div class="status-bar">
      <span class="status-time" id="status-time">08:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- Pull-to-refresh indicator -->
    <div class="ptr-indicator" id="ptr-indicator">
      <div class="ptr-spinner" id="ptr-spinner"></div>
      <span id="ptr-text">Kéo để làm mới</span>
    </div>

    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-location">
        <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span id="city-name">Hoằng Tiến, Thanh Hóa</span>
        <button class="header-refresh-btn" id="header-refresh-btn" onclick="loadWeather()" title="Làm mới">
          <svg id="header-refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>

      <div class="hero-weather" id="hero-weather">
        <!-- Loading skeleton -->
        <div class="skeleton-wrap" id="skeleton">
          <div class="skeleton skel-emoji"></div>
          <div class="skeleton skel-temp"></div>
          <div class="skeleton skel-desc"></div>
        </div>

        <!-- Real data -->
        <div class="hero-data hidden" id="hero-data">
          <div class="hero-emoji-wrap">
            <div class="hero-emoji" id="hero-emoji">☀️</div>
            <div class="hero-glow" id="hero-glow"></div>
          </div>
          <div class="hero-temp-block">
            <div class="hero-temp" id="hero-temp">--°</div>
            <div class="hero-desc" id="hero-desc">--</div>
            <div class="hero-feels" id="hero-feels">Cảm giác --°</div>
          </div>
        </div>
      </div>

      <div class="hero-datetime" id="hero-datetime"></div>
    </section>

    <!-- Scrollable Content -->
    <div class="scroll-content">

      <!-- Stats Pills -->
      <div class="stats-strip glass-card">
        <div class="stat-pill">
          <span class="stat-icon">💧</span>
          <span class="stat-val" id="s-humidity">--%</span>
          <span class="stat-lbl">Độ ẩm</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-pill">
          <span class="stat-icon">💨</span>
          <span class="stat-val" id="s-wind">--</span>
          <span class="stat-lbl">Gió</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-pill">
          <span class="stat-icon">🌞</span>
          <span class="stat-val" id="s-uv">--</span>
          <span class="stat-lbl">UV</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-pill">
          <span class="stat-icon">🌧️</span>
          <span class="stat-val" id="s-precip">--</span>
          <span class="stat-lbl">Mưa</span>
        </div>
      </div>

      <!-- Hourly Forecast -->
      <div class="card glass-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          DỰ BÁO THEO GIỜ
        </div>
        <div class="hourly-scroll">
          <div class="hourly-track" id="hourly-track"></div>
        </div>
      </div>

      <!-- 2-Day Forecast -->
      <div class="card glass-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          DỰ BÁO 2 NGÀY TỚI
        </div>
        <div class="daily-list" id="daily-list"></div>
      </div>

      <!-- Footer -->
      <div class="app-footer">
        <p>Dữ liệu từ <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></p>
        <p>Cập nhật lúc <span id="last-update">--</span></p>
      </div>

    </div><!-- end scroll-content -->

    <!-- Bottom Nav Bar (iOS/Android style) -->
    <nav class="bottom-nav">
      <button class="nav-btn active" id="btn-refresh" onclick="loadWeather()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="refresh-icon">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>Làm mới</span>
      </button>
      <div class="nav-center-indicator">
        <div class="weather-dot" id="nav-dot"></div>
      </div>
      <button class="nav-btn" onclick="shareWeather()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span>Chia sẻ</span>
      </button>
    </nav>

  </div><!-- end app-shell -->

  <script src="app.js"></script>
</body>
</html>
