name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =====================
  # JOB 1: ANDROID APK
  # =====================
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android || echo "Android already added"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-android.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Thoi Tiet App v${{ github.run_number }}"
          body: |
            ## App Thoi Tiet - Hoang Tien, Thanh Hoa

            ### Cai dat Android:
            1. Tai file `weather-app-android.apk`
            2. Bat "Cho phep cai tu nguon khong ro" trong Cai dat
            3. Mo file APK de cai

            Built from commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================
  # JOB 2: iOS IPA
  # =====================
  build-ios:
    name: iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Add iOS platform
        run: npx cap add ios || echo "iOS already added"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install Pods
        run: |
          cd ios/App
          pod install

      - name: Build iOS (simulator - unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p ios/ipa
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../../ios/ipa/ThoiTiet-iOS.zip App.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-ios
          path: ios/ipa/
          retention-days: 30
