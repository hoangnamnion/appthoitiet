name: Build Android APK & iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =====================
  # 🤖 JOB 1: ANDROID APK
  # =====================
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Bundle Web Assets to www/
        run: npm run build

      - name: ⚙️ Ensure Capacitor Config webDir is www
        run: |
          node -e '
            const fs = require("fs");
            let cfg = {};
            if (fs.existsSync("capacitor.config.json")) {
              cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            }
            cfg.appId = cfg.appId || "com.thoitiet.hoangtienvn";
            cfg.appName = cfg.appName || "Thoi Tiet";
            cfg.webDir = "www";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            console.log("Verified capacitor.config.json with webDir=www");
          '

      - name: 📱 Add & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Make Gradlew executable
        run: chmod +x android/gradlew

      - name: 🛠️ Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThoiTiet-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # =====================
  # 🍎 JOB 2: iOS IPA
  # =====================
  build-ipa:
    name: Build Native iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Bundle Web Assets to www/
        run: npm run build

      - name: ⚙️ Ensure Capacitor Config webDir is www
        run: |
          node -e '
            const fs = require("fs");
            let cfg = {};
            if (fs.existsSync("capacitor.config.json")) {
              cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            }
            cfg.appId = cfg.appId || "com.thoitiet.hoangtienvn";
            cfg.appName = cfg.appName || "Thoi Tiet";
            cfg.webDir = "www";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            console.log("Verified capacitor.config.json with webDir=www");
          '

      - name: 📱 Add & Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 🛠️ Build iOS App with Xcode (Unsigned / Ad-hoc)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: 📦 Package into .IPA (Payload structure)
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy thư mục App.app!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 ThoiTiet-iOS.ipa Payload
          echo "🎉 Đóng gói thành công ThoiTiet-iOS.ipa"

      - name: 🚀 Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ThoiTiet-iOS-IPA
          path: ThoiTiet-iOS.ipa
          retention-days: 30
